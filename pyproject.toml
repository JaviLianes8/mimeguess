[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mimeguess"
version = "0.2.0"
description = "Deterministic, OS-independent file extension and MIME type mapping generated from mime-db, zero dependencies"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "LICENSES/mime-db.txt", "LICENSES/mime-types.txt"]
authors = [{ name = "Javier Lianes", email = "javier@lianes8studio.com" }]
keywords = ["mime", "mimetypes", "media-type", "content-type", "file-extension", "mime-db"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
mimeguess = "mimeguess._cli:main"

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "build", "twine"]

[project.urls]
Homepage = "https://lianes8studio.com"
Repository = "https://github.com/JaviLianes8/mimeguess"
Issues = "https://github.com/JaviLianes8/mimeguess/issues"
Changelog = "https://github.com/JaviLianes8/mimeguess/blob/main/CHANGELOG.md"
LinkedIn = "https://www.linkedin.com/in/jlianes/"
Funding = "https://buymeacoffee.com/jlianesglrs"

[tool.hatch.build.targets.wheel]
packages = ["src/mimeguess"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "data", "LICENSES", "LICENSE", "README.md", "GUIDE.md", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = ["src", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
